version: 2

build:
  os: ubuntu-24.04
  tools:
    python: '3.14'
  jobs:
    build:
      html:
        - NO_MKDOCS_2_WARNING=1 uv run --locked --group docs mkdocs build --strict --site-dir "$READTHEDOCS_OUTPUT/html"

python:
  install:
    - method: uv
      command: sync
      groups:
        - docs

mkdocs:
  configuration: mkdocs.yml
  fail_on_warning: true
