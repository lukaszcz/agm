[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agm"
version = "0.1.2"
description = "Unified CLI for managing worktrees, project dependencies, configuration and tmux sessions"
license = "GPL-3.0-or-later"
requires-python = ">=3.12"
dependencies = [
    "click>=8.2",
    "immutables>=0.21",
    "json-repair>=0.30",
    "jsonschema>=4.0",
    "lark>=1.2",
    "packaging>=25",
    "pathspec>=1.0",
    "plumbum>=1.9.0",
    "prompt-toolkit>=3.0",
    "python-dotenv>=1.2.2",
    "requests>=2.34.2",
    "semver>=3.0",
    "tomlkit>=0.13.0",
    "typer>=0.16.0",
    "urllib3>=2.2",
]

[project.scripts]
agm = "agm.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/agm"]

[tool.hatch.build.targets.wheel.force-include]
"packages/stdlib" = "agm/stdlib"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--cov=agm", "--cov=packages/stdlib/src", "--cov-branch", "--cov-fail-under=100"]

[tool.mypy]
# Keep direct invocations and the standard workflow on the same local stubs.
mypy_path = ["$MYPY_CONFIG_FILE_DIR/src", "$MYPY_CONFIG_FILE_DIR/stubs"]
# The toolchain runs on 3.14 -- coverage's sys.monitoring core needs it to
# measure branches -- but analysis stays on the `requires-python` floor, so the
# oldest interpreter the project claims to support keeps being checked.
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_any_expr = true
disallow_any_generics = true
disallow_any_decorated = true
disallow_subclassing_any = true
disallow_untyped_calls = true

[tool.coverage.report]
# Branches are measured through sys.monitoring (see the `test` recipe in the
# justfile), which does not report the arc into a `with` body. Those lines are
# recorded as one-sided rather than left as gaps no test could ever close.
partial_also = ["^\\s*(async\\s+)?with\\b"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.vulture]
min_confidence = 60
ignore_decorators = ["@*.command", "@*.callback", "@bindings.add"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=6.0",
    "pytest-xdist>=3.0",
    "mypy>=1.10",
    "ruff>=0.11",
    "vulture>=2.16",
    "typesafe-sdk>=0.7.1,<1",
    "httpx2>=2.13.0",
]
