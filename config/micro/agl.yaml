filetype: agl

detect:
    filename: "\\.agl$"

# Rule order is significant: micro paints the whole of each match and lets a
# later rule overwrite an earlier one.  AgL identifiers are greedy -- they stop
# only at the delimiters in `IDENT_STOP' (src/agm/util/ident.py), so every
# other character continues a name, operator characters such as `-', `?' and
# `$' included.  Regexp `\b' does not know that, so word rules alone would
# paint `resource' inside `resource-path'.  The file is therefore layered:
# ambiguous operator characters first (word rules override them inside a name),
# then word rules, then a repair rule that repaints any name containing an
# operator character, then the spellings that legitimately contain one, and
# finally the true delimiters -- which can never occur inside a name, so
# repainting them last is always safe.
rules:
    # Operator characters that double as identifier characters.  Painted first
    # so that `ask-request' faces as one name rather than two around a `-'.
    - symbol.operator: "(=>|->|:=|==|!=|<=|>=|[-+*<>])"

    # True delimiters.  These can never occur inside an identifier, so they are
    # safe to paint at any point; they come before the numbers so that a
    # decimal literal repaints over its own `.'.
    - symbol.operator: "(::|[/=@])"
    - symbol: "([:;,.|])"
    - symbol.brackets: "([(){}]|\\[|\\])"

    # Literals.
    - constant.number: "\\b[0-9]+\\.[0-9]+\\b"
    - constant.number: "\\b[0-9]+\\b"
    - constant.bool: "\\b(true|false)\\b"
    - constant: "\\b(null)\\b"

    # Module/scope headers and declaration modifiers.
    - preproc: "\\b(import|use|export|hiding|scope|end|builtin|extern)\\b"
    - statement: "\\b(record|enum|type|exception|extends|program|def|fn|let|var|infixl|infixr|prio)\\b"

    # Control flow and expression keywords.
    - statement: "\\b(for|while|do|until|done|if|else|case|of|try|catch|raise|break|continue|return)\\b"
    - statement: "\\b(as|and|or|not|is|in|to|downto|step|with)\\b"

    # Contextual built-ins and primitive type names.
    - identifier: "\\b(print|render|exec|ask|shallow-copy|copy|resource)\\b"
    - type: "\\b(unit|text|json|bool|int|decimal|array|dict)\\b"

    # Boundary repair: a name containing an operator character is one
    # identifier, not a keyword beside an operator.  Repainting the whole run
    # undoes any rule that fired inside it, from either end -- this is what
    # keeps `resource-path', `record-id', `do-it!', `x-1' and `x-resource' plain.
    - default: "\\b[\\p{L}_][\\p{L}\\p{N}_]*[^\\]\\[(){}:,.|;/@=\\s\\p{L}\\p{N}_][^\\]\\[(){}:,.|;/@=\\s]*"

    # Spellings that legitimately contain an operator character, re-faced after
    # the repair.  Each consumes the delimiter that has to follow it, so a
    # longer name merely starting with one of them stays plain (`ask-request-x').
    - identifier: "\\b(ask-request|resource-dir|shallow-copy)($|[\\]\\[(){}:,.|;/@=\\s])"
    - statement: "\\bas\\?($|[\\]\\[(){}:,.|;/@=\\s])"

    # `?' and `?N' partial-application placeholders.  A placeholder is a whole
    # argument, so it follows an opening bracket, a comma, or whitespace;
    # anchoring on that character is what keeps the `?' ending a name such as
    # `is-ready?' plain.  The anchor is repainted just below.
    - symbol.operator: "(^|[\\s(\\[,])\\?[0-9]*"

    # Repaint the delimiter each rule above had to swallow.  `.' is left out
    # on purpose: repainting it here would also re-split the `.' of a decimal
    # literal, so a `.' directly after one of the spellings above keeps that
    # spelling's colour instead.
    - symbol.operator: "(::|[/=@])"
    - symbol: "([:;|,])"
    - symbol.brackets: "([(){}]|\\[|\\])"

    # Multi-character operator tokens, restored after the delimiter rules that
    # would otherwise split them.  `::' and `:=' are fixed spellings whose `:'
    # is a true delimiter, so neither can occur inside a name and both are safe
    # to repaint anywhere.  Every other operator name is a run of two or more
    # operator characters (`|>', `<|', `>>', or any `infixl'/`infixr' spelling);
    # those characters also continue a name, so the run is anchored to
    # whitespace, which no name can contain -- and painting the anchor with it
    # is invisible.
    - symbol.operator: "(::|:=)"
    - symbol.operator: "(^|\\s)[!$%&*+\\-/<=>?\\\\^|~]{2,}"

    # Declaration attributes: a `@name' prefix, optionally followed by an
    # argument list.  `@' is a true delimiter, so the prefix always starts at
    # the `@' and its name runs to the next delimiter -- no boundary repair is
    # needed.  The rule comes after the delimiter repaints above so that the
    # `@' it owns is not repainted back to an operator; the argument list is
    # ordinary AgL and keeps the faces the rules above gave it.
    - preproc: "@[\\p{L}_][^\\]\\[(){}:,.|;/@=\\s]*"

    # Raw-tail payloads. The tail of an `exec$'/`ask$' line is verbatim text,
    # not AgL, so the whole tail is a region: a keyword or an apostrophe inside
    # a shell command is content, not code.  Micro paints a region's start
    # delimiter with the region's own group, so the opener faces as part of the
    # payload rather than as a builtin -- the tail's verbatim reading is what
    # matters, and unlike the Emacs mode there is no way to split the two.
    # Only the inline form is covered; an indented block payload is beyond what
    # a regexp-only region can delimit.  The opener must begin a token: `-'
    # continues an AgL name, so `do-exec$' is one identifier even though `\b'
    # sees a boundary before its `exec$'.  A region's start delimiter is the
    # one thing no later rule can repaint, so the boundary is spelled out as
    # the delimiter that must precede it (any `IDENT_STOP' character, or the
    # line start) and swallowed into the region -- painting a space or a
    # bracket with the payload's colour is invisible.
    - constant.string:
        start: "(^|[\\]\\[(){}:,.|;/@= \t])(exec|ask)\\$"
        end: "$"

    # Template strings. AgL strings may contain %{...}; this highlights the
    # interpolation delimiters without trying to parse nested AgL expressions.
    - constant.string:
        start: "\"\"\""
        end: "\"\"\""
        skip: "\\\\."
        rules:
            - constant.specialChar: "\\\\."
            - special: "%\\{|\\}"

    - constant.string:
        start: "'''"
        end: "'''"
        skip: "\\\\."
        rules:
            - constant.specialChar: "\\\\."
            - special: "%\\{|\\}"

    - constant.string:
        start: "\""
        end: "(\"|$)"
        skip: "\\\\."
        rules:
            - constant.specialChar: "\\\\."
            - special: "%\\{|\\}"

    - constant.string:
        start: "'"
        end: "('|$)"
        skip: "\\\\."
        rules:
            - constant.specialChar: "\\\\."
            - special: "%\\{|\\}"

    - comment:
        start: "#"
        end: "$"
        rules:
            - todo: "(TODO|XXX|FIXME|NOTE|BUG):?"
