[package]
name = "review_tools"
version = "0.2.0"
description = "Review workflow commands"
license = "MIT"
authors = ["AGM"]
repository = "https://example.test/review-tools"
keywords = ["review", "workflow"]

[dependencies]
std = "0.1"
judge = { version = "0.1", path = "../judge" }
tools = { version = "1.1", url = "https://example.test/tools.agmpkg", hash = "sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa" }

[commands]
review-loop = { program = "review_tools/review::main", doc = "Run the review loop" }
"review-loop lint" = { program = "review_tools/lint::main", doc = "Lint review configurations" }
