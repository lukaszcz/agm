[run.claude]
alias = "claude --dangerously-skip-permissions"

[run.codex]
alias = "codex --yolo"

[loop.claude]
runner = "claude -p '@%{PROMPT_FILE}'"

[loop.pi]
runner = "agm run pi -p '@%{PROMPT_FILE}'"

# [exec] — AgL workflow settings (agm exec).
# Uncomment and adjust as needed; all fields are optional.
#
# [exec]
# default-agent = "claude/sonnet-medium" # native agent shorthand or custom command
# strict-json = false           # require bare JSON from agents (default: lenient recovery)
# max-call-depth = 256          # recursion call-depth limit (default: 256)
# timeout = "30m"               # initial shell-exec and agent idle timeout
# log = false                   # trace logging; off by default — set true to enable
# log-file = "trace.jsonl"      # explicit trace path (omit for auto timestamped path)
#

# [repl] — AgL REPL settings (agm repl).
#
# [repl]
# theme = "auto"    # syntax-highlighting theme: "dark", "light", or "auto" (detect from $COLORFGBG)

# [packages] — pins for installed package versions. In this home-level template,
# uncommented pins apply globally; project or workspace config can override them.
#
# review_tools = "0.2.0"

# Qualified AgL program and parameter settings.
#
# Config tables use a module suffix followed by a declaration scope path. The
# entry file's stem is its module component. A longer module suffix resolves
# ambiguity; ``["review-tools/judge".review]`` is an exact module anchor.
# The same table also supplies a selected ``program def``'s own value
# parameters, keyed by name. CLI options override config values for both.
# Inline ``-c`` value parameters are CLI-only.
#
# [review-workflow.main]
# timeout = "60s"               # engine-key override for this program
# log = true
# region = "us-east"            # a program def's own text value parameter
#
# [judge.review]
# topic = "security"            # text parameter — verbatim string
# verbose = true                 # bool parameter — native TOML bool
# max-iter = 3                   # int parameter — native TOML integer
# tags = ["bug", "audit"]       # list parameter — TOML array (or a JSON string)
# ratio = "0.75"                # decimal parameters must be quoted strings
