[run.claude]
alias = "claude --dangerously-skip-permissions"

[run.codex]
alias = "codex --yolo"

[loop.claude]
runner = "claude -p '@%{PROMPT_FILE}'"

[loop.pi]
runner = "agm run pi -p '@%{PROMPT_FILE}'"

# [exec] — AgL workflow runner settings (agm exec).
# Uncomment and adjust as needed; all fields are optional.
#
# [exec]
# runner = "claude -p"          # default agent runner (falls back to [loop] runner)
# strict-json = false           # require bare JSON from agents (default: lenient recovery)
# max-iters = 5                 # safety-valve cap for otherwise unbounded loops
# max-call-depth = 256          # recursion call-depth limit (default: 256)
# timeout = "30m"               # initial shell-exec and agent idle timeout
# log = false                   # trace logging; off by default — set true to enable
# log-file = "trace.jsonl"      # explicit trace path (omit for auto timestamped path)
#
# [exec.agents]                 # per-agent runner commands (highest precedence)
# reviewer = "claude -p"

# [repl] — AgL REPL settings (agm repl).
#
# [repl]
# theme = "auto"    # syntax-highlighting theme: "dark", "light", or "auto" (detect from $COLORFGBG)

# [<program>] — per-program settings.
#
# For ``agm exec``, the table key is the ``program NAME`` declaration, or the
# .agl file stem when no declaration is present. CLI param options (e.g.
# ``--topic``) override config values; config values for params suppress the
# default expression. Inline ``-c`` programs with no declaration have no config
# table. Engine-key overrides (e.g. ``timeout``) take precedence over ``[exec]``
# (``[<program>].X > [exec].X > engine default``).
#
# In ``agm repl``, only ``program NAME`` selects this table; there is no file-stem
# fallback or per-param CLI option. The name applies to params declared after it
# in that entry and, after a successful entry, to later entries. This table does
# not override REPL engine settings.
#
# [review-workflow]
# timeout  = "60s"              # engine-key override for agm exec
# log      = true               # engine-key override for agm exec
# topic    = "security"         # text param — verbatim string
# verbose  = true               # bool param — native TOML bool
# max-iter = 3                  # int param  — native TOML integer
# tags     = ["bug", "audit"]   # list param — TOML array (or a JSON string)
# ratio    = "0.75"             # decimal param — MUST be a quoted string;
#                               #   a bare TOML float (0.75) is rejected because
#                               #   AgL forbids binary floating-point values.
